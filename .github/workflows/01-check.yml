name: 01 - Check

# Runs on every PR, and again on main as the gate the release workflow calls
# before it is allowed to tag anything. A pipeline that tags untested code is
# worse than no pipeline.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Tests, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3
        with:
          enable-cache: true

      - name: Sync the dev toolchain
        run: uv sync

      - name: Tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy .

      # The deployment is healthcheck.py + hc/ run by a server's own python3
      # with no third-party packages. This proves that still holds.
      - name: Deployed file set is self-contained and stdlib-only
        run: make deploy-check
